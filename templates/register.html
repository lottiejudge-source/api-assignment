{% extends "base.html" %}

{% block title %}Register - Coin Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Create an Account</h2>

    <div id="alert-box" class="hidden mb-4 p-4 rounded text-sm" role="alert"></div>

    <form id="registerForm" class="space-y-4">
        <div>
            <label for="user_name" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" 
                   id="user_name" 
                   name="user_name" 
                   required 
                   autofocus
                   autocomplete="username"
                   pattern="^[a-zA-Z0-9_]+$"
                   title="Username can only contain letters, numbers, and underscores."
                   maxlength="50"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            <p class="text-xs text-gray-500 mt-1">Letters, numbers, and underscores only.</p>
        </div>

        <div>
            <label for="user_password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" 
                   id="user_password" 
                   name="user_password" 
                   required 
                   minlength="8"
                   autocomplete="new-password"
                   maxlength="128"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters long.</p>
        </div>

        <div>
            <label for="role" class="block text-sm font-medium text-gray-700">Account Type</label>
            <select id="role" 
                    name="role" 
                    required 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2 bg-white">
                <option value="authorised">Standard User (Authorised)</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit" 
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition font-medium">
            Register Account
        </button>
    </form>
    
    <p class="mt-4 text-center text-sm text-gray-600">
        Already have an account? <a href="/login" class="text-indigo-600 hover:underline">Sign In</a>
    </p>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alert-box');
    alertBox.classList.add('hidden');

    const user_name = document.getElementById('user_name').value;
    const user_password = document.getElementById('user_password').value;
    const role = document.getElementById('role').value;

    try {
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_name, user_password, role })
        });

        const data = await response.json();

        if (response.ok) {
            alertBox.className = 'mb-4 p-4 rounded text-sm bg-green-100 border border-green-400 text-green-700';
            alertBox.textContent = 'Registration successful! Redirecting to login...';
            alertBox.classList.remove('hidden');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } else {
            alertBox.className = 'mb-4 p-4 rounded text-sm bg-red-100 border border-red-400 text-red-700';
            alertBox.textContent = data.detail || 'Registration failed.';
            alertBox.classList.remove('hidden');
        }
    } catch (error) {
        alertBox.className = 'mb-4 p-4 rounded text-sm bg-red-100 border border-red-400 text-red-700';
        alertBox.textContent = 'An unexpected error occurred. Please try again.';
        alertBox.classList.remove('hidden');
    }
});
</script>
{% endblock %}
