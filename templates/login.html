{% extends "base.html" %}

{% block title %}Login - Coin Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Login</h2>

    <div id="alert-box" class="hidden mb-4 p-4 rounded text-sm bg-red-100 border border-red-400 text-red-700" role="alert"></div>

    <form id="loginForm" class="space-y-4">
        <div>
            <label for="user_name" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" 
                   id="user_name" 
                   name="user_name" 
                   required 
                   autofocus
                   autocomplete="username"
                   maxlength="50"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
        </div>

        <div>
            <label for="user_password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" 
                   id="user_password" 
                   name="user_password" 
                   required 
                   autocomplete="current-password"
                   maxlength="128"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
        </div>

        <button type="submit" 
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition font-medium">
            Sign In
        </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
        Don't have an account? <a href="/register" class="text-indigo-600 hover:underline">Register here</a>
    </p>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const alertBox = document.getElementById('alert-box');
    alertBox.classList.add('hidden');

    const user_name = document.getElementById('user_name').value;
    const user_password = document.getElementById('user_password').value;

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_name, user_password })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('role', data.role);
            // adding cookies so the app knows I'm logged in
            document.cookie = `user=${data.user_name || user_name}; path=/; max-age=86400; SameSite=Lax`;
            document.cookie = `role=${data.role}; path=/; max-age=86400; SameSite=Lax`;
            window.location.href = '/';
        } else {
            alertBox.textContent = data.detail || 'Invalid username or password.';
            alertBox.classList.remove('hidden');
        }
    } catch (error) {
        alertBox.textContent = 'An unexpected error occurred. Please try again.';
        alertBox.classList.remove('hidden');
    }
});
</script>
{% endblock %}
