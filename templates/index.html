{% extends "base.html" %}

{% block title %}{{ title }} - Dashboard{% endblock %}

{% block content %}
<header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h2>Coins Overview</h2>
    {% if user %}
        <p>Welcome back, <strong>{{ user }}</strong>!</p>
    {% else %}
        <a href="/login" role="button" class="contrast">Login to Manage</a>
    {% endif %}
</header>

{% if coins %}
<figure>
    <table role="grid">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Coin Name</th>
                <th scope="col">Status</th>
                {% if user %}
                <th scope="col">Actions</th>
                {% endif %}
            </tr>
        </thead>
        <tbody>
            {% for coin in coins %}
            <tr>
                <td>{{ coin.id if coin.id is defined else coin.coin_id }}</td>
                <td>{{ coin.name if coin.name is defined else coin.coin_name }}</td>
                <td>
                    {% if coin.is_complete or coin.coin_complete %}
                        <ins style="color: var(--pico-ins-color, green); font-weight: bold;">Completed</ins>
                    {% else %}
                        <del style="color: var(--pico-del-color, red); font-weight: bold;">Pending</del>
                    {% endif %}
                </td>
                {% if user %}
                <td>
                    <form action="/coins/{{ coin.id if coin.id is defined else coin.coin_id }}/toggle" method="POST" style="margin: 0;">
                        <button type="submit" class="outline style-sm" style="padding: 0.25rem 0.5rem; font-size: 0.85rem;">Toggle Status</button>
                    </form>
                </td>
                {% endif %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</figure>
{% else %}
<article>
    <p>No coins found in the database.</p>
</article>
{% endif %}
{% endblock %}
