<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lottie's Coins{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>🪙 The Coins</strong></li>
        </ul>
        <li><a href="/">Dashboard</a></li>
            {% if user %}
                {% if role == 'admin' %}
                    <li><a href="/admin/logs" role="button" class="contrast outline">Audit Logs</a></li>
                {% endif %}
                <li><a href="/logout" onclick="localStorage.clear();" role="button" class="secondary outline">Logout</a></li>
            {% else %}
                <li><a href="/register" role="button" class="outline">Register</a></li>
                <li><a href="/login" role="button">Login</a></li>
            {% endif %}
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
